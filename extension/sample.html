<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIO PII Redaction Test Bench</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    h1 {
      color: var(--accent);
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .info-box {
      background-color: rgba(56, 189, 248, 0.1);
      border-left: 4px solid var(--accent);
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CLIO / MUDRA PII Redaction Demo</h1>
    <div class="info-box">
      Use this page to verify that sensitive PII inputs (Aadhaar, Credit Card, PAN, UPI, Email) are intercepted and redacted locally before leaving the client.
    </div>

    <form onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" value="Alice Smith" placeholder="Enter Full Name">
      </div>

      <div class="form-group">
        <label for="email">Email Address (PII)</label>
        <input type="email" id="email" value="alice@example.com" placeholder="Enter Email">
      </div>

      <div class="form-group">
        <label for="pan">PAN Card Number (PII)</label>
        <input type="text" id="pan" value="ABCDE1234F" placeholder="e.g. ABCDE1234F">
      </div>

      <div class="form-group">
        <label for="aadhaar">Aadhaar Number (PII - Verhoeff Validated)</label>
        <input type="text" id="aadhaar" value="4991 1866 5121" placeholder="12 digit Aadhaar">
      </div>

      <div class="form-group">
        <label for="card">Credit Card Number (PII - Luhn Validated)</label>
        <input type="text" id="card" value="4532 0151 1283 0366" placeholder="Card Number">
      </div>

      <div class="form-group">
        <label for="upi">UPI VPA (PII)</label>
        <input type="text" id="upi" value="alice@oksbi" placeholder="user@bank">
      </div>

      <div class="form-group">
        <label for="ifsc">IFSC Code (PII)</label>
        <input type="text" id="ifsc" value="SBIN0001234" placeholder="IFSC Code">
      </div>

      <button type="submit" id="submitBtn">Submit Secure Request</button>
    </form>
  </div>
</body>
</html>
