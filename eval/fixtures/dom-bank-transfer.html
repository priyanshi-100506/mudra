<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bank — Add a Payee</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #16181d; }
  header { background: #0b3d91; color: #fff; padding: 18px 32px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  main { max-width: 680px; margin: 32px auto; background: #fff; padding: 28px 32px;
         border: 1px solid #dcdde1; }
  h2 { margin: 0 0 20px; font-size: 19px; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  label { width: 200px; text-align: right; font-size: 14px; color: #3c3f47; }
  input, select { flex: 1; padding: 8px 10px; border: 1px solid #c4c6cc; font-size: 14px; }
  button { padding: 9px 22px; background: #0b3d91; color: #fff; border: none; font-size: 14px; }
  .note { margin-top: 20px; font-size: 12px; color: #83868f; }
  .doc { width: 420px; height: 260px; border: 1px solid #c4c6cc; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 7px 9px; border-bottom: 1px solid #ececef; text-align: left; }
</style>

</head>
<body>
<header><h1>Bank — Add a Payee</h1></header>
<main>
<h2>Add a new payee</h2>
  <div class="row">
    <label for="payee_name">Payee name</label>
    <input id="payee_name" name="payee_name" value="Sunita Rao" >
  </div>
  <div class="row">
    <label for="payee_account">Account number</label>
    <input id="payee_account" name="payee_account" value="6011000999888773" >
  </div>
  <div class="row">
    <label for="payee_ifsc">IFSC code</label>
    <input id="payee_ifsc" name="payee_ifsc" value="SBIN0009876" >
  </div>
  <div class="row">
    <label for="payee_upi">Or UPI ID</label>
    <input id="payee_upi" name="payee_upi" value="sunita.rao@paytm" >
  </div>
  <div class="row">
    <label for="notify_email">Notify by email</label>
    <input id="notify_email" name="notify_email" value="billing@vendor.example.test" >
  </div>
  <div class="row">
    <label for="branch_code">Internal branch code</label>
    <input id="branch_code" name="branch_code" value="ZZZZ0BRANCH" >
  </div>
  <button>Add payee</button>
</main>
<p class="note" style="text-align:center">Synthetic fixture. Every identifier on this page is fake.</p>
</body>
</html>
